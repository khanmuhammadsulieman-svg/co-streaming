<script>
  function handleLogin(event) {
    event.preventDefault();
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    let savedCreds = JSON.parse(localStorage.getItem('co_streaming_auth') || JSON.stringify({user:'admin', pass:'admin'}));
    if (u === savedCreds.user && p === savedCreds.pass) {
      sessionStorage.setItem('auth', 'true');
      document.getElementById('loginScreen').style.display = 'none';
      if(window.renderApp) window.renderApp();
    } else {
      alert("Incorrect Username or Password. Default: admin / admin");
    }
  }
</script>

function getBuffer(len) {
  const b = new Uint8Array(len);
  window.crypto.getRandomValues(b);
  return b;
}

window.setupBiometrics = async function() {
  if (!window.PublicKeyCredential) {
    alert("Biometrics not supported on this device/browser.");
    return;
  }
  try {
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: getBuffer(32),
        rp: { name: "Co Streaming", id: window.location.hostname || "localhost" },
        user: { id: getBuffer(16), name: "admin", displayName: "Admin" },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
        timeout: 60000,
        attestation: "none"
      }
    });
    const credId = Array.from(new Uint8Array(cred.rawId));
    localStorage.setItem('co_streaming_bio', JSON.stringify(credId));
    alert("Fingerprint / Face ID enabled successfully!");
    document.getElementById('bioLoginBtn').style.display = 'block';
  } catch(e) {
    alert("Biometric setup canceled or failed.");
  }
}

window.loginWithBiometrics = async function() {
  const storedId = JSON.parse(localStorage.getItem('co_streaming_bio'));
  if(!storedId) return alert("Biometrics not configured yet.");
  try {
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge: getBuffer(32),
        rpId: window.location.hostname || "localhost",
        allowCredentials: [{ type: "public-key", id: new Uint8Array(storedId) }],
        userVerification: "required",
        timeout: 60000
      }
    });
    if(assertion) {
      sessionStorage.setItem('auth', 'true');
      document.getElementById('loginScreen').style.display = 'none';
      render();
    }
  } catch(e) {
    alert("Biometric verification failed.");
  }
}

async function save(){

  if(!cloudReady) return;
  try{
    document.getElementById('syncStatus').textContent='SAVING...';
    await setDoc(cloudRef,{data,updatedAt:new Date().toISOString()});
    document.getElementById('syncStatus').textContent='CLOUD SYNCED ✓';
  }catch(e){
    document.getElementById('syncStatus').textContent='OFFLINE MODE';
  }
}

const rs=n=>'Rs. '+Number(n||0).toLocaleString('en-PK');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const dateObj=d=>new Date(d+'T00:00:00');
const expiry=(d,n)=>{let x=dateObj(d);x.setDate(x.getDate()+Number(n));return x.toISOString().slice(0,10)};
const days=d=>Math.ceil((dateObj(d)-new Date(new Date().toDateString()))/86400000);
const status=s=>!s.expiry?'—':days(s.expiry)<0?'Expired':days(s.expiry)<=7?'Expiring':'Active';
const income=a=>a.filter(s=>s.payment==='Paid').reduce((x,s)=>x+Number(s.amount||0),0) + a.filter(s=>s.payment==='Partial').reduce((x,s)=>x+Number(s.partialPaid||0),0);
const grossSales=a=>a.reduce((x,s)=>x+Number(s.amount||0),0);
const purchase=a=>a.reduce((x,s)=>x+Number(s.purchase||0),0);
const expenses=a=>a.reduce((x,s)=>x+Number(s.amount||0),0);

 return `<h1>Admin Overview</h1><p class="muted">Co Streaming Dashboard</p>
 <div class="cards">

function showDetails(type){
 const paid=income(data.sales), cost=purchase(data.sales.filter(s=>s.payment==='Paid' || s.payment==='Partial')), exp=expenses(data.expenses);
 const pending=data.sales.filter(s=>s.payment!=='Paid');
 let title='',body='';
 const list=a=>a.length?`<div class="table"><table><thead><tr><th>Client</th><th>Item</th><th>Amount</th><th>Status</th></tr></thead><tbody>${a.map(s=>`<tr><td>${esc(s.client)}</td><td>${esc(s.product)}</td><td>${rs(s.amount)}</td><td>${s.payment}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No records found.</div>';
 if(type==='income'){title='💼 Paid Income';body=`<h2>${rs(paid)}</h2>${list(data.sales.filter(s=>s.payment==='Paid'||s.payment==='Partial'))}`;}
 if(type==='purchase'){title='🛒 Purchase Cost';body=`<h2>${rs(cost)}</h2>${list(data.sales.filter(s=>Number(s.purchase||0)>0))}`;}
 if(type==='expenses'){title='💸 Expenses';body=`<h2>${rs(exp)}</h2><button class="primary" onclick="closeModal();go('expenses')">Open Expenses</button>`;}
 if(type==='profit'){title='📈 Net Profit';body=`<div class="card"><small>NET PROFIT</small><b>${rs(paid-cost-exp)}</b></div>`;}
 if(type==='transactions'){title='📦 All Transactions';body=list(data.sales);}
 if(type==='pending'){title='⏳ Pending';body=list(pending);}
 modal(`<div class="sectionHead"><h2>${title}</h2><button onclick="closeModal()">×</button></div>${body}`);
}

}

function openSale(){
  let prefetchChips = data.products.map(p => `<div class="prefetch-chip" onclick="prefetchProduct('${esc(p.name)}', ${p.price}, '${p.type}', ${p.type==='Subscription'?30:0})" style="display:inline-flex;align-items:center;gap:8px;background:#f8fafc;border:2px solid #dbe1ea;border-radius:12px;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:bold">${getProductIcon(p.name)}<div style="text-align:left"><span>${esc(p.name)}</span><br><span class="muted">${rs(p.price)}</span></div></div>`).join('');
  let opts=data.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${p.type}</option>`).join('');
  
  modal(`<div class="sectionHead"><h2>Add Sale</h2><button onclick="closeModal()">×</button></div><form id="sf" class="grid">
  <label class="field full"><span>⚡ Quick Prefetch:</span><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:180px;overflow-y:auto">${prefetchChips}</div></label>
  <label class="field"><span>Product / Service *</span><select id="sp"><option value="">Custom</option>${opts}</select></label>
  <label class="field full"><span>Product Name</span><input id="customProduct" placeholder="Product name"></label>
  <label class="field"><span>Client Name *</span><input id="sc" required placeholder="Customer Name"></label>
  <label class="field"><span>Phone / WhatsApp</span><input id="sph" placeholder="03001234567"></label>
  <label class="field"><span>Amount *</span><input id="sa" type="number" required placeholder="0"></label>
  <label class="field"><span>Purchase Cost</span><input id="spurchase" type="number" value="0" placeholder="0"></label>
  <label class="field"><span>Sale Date</span><input id="sd" type="date" value="${today()}" required></label>
  <label class="field"><span>Payment</span><select id="payment"><option>Paid</option><option>Pending</option><option>Partial</option></select></label>
  <label class="field"><span>Tenure Days</span><input id="stm" type="number" value="30"></label>
  <div class="full actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Save Sale</button></div></form>`);

  document.getElementById('sp').onchange = () => {
    let p = data.products.find(x => x.id == document.getElementById('sp').value);
    if(p){ document.getElementById('customProduct').value = p.name; document.getElementById('sa').value = p.price; document.getElementById('stm').value = p.type === 'Subscription' ? '30' : '0'; }
  };

  document.getElementById('sf').onsubmit = e => {
    e.preventDefault();
    let name = document.getElementById('customProduct').value.trim();
    if(!name){ alert('Provide name'); return; }
    let tenure = +document.getElementById('stm').value;
    let saleDate = document.getElementById('sd').value;
    data.sales.unshift({
      id: Date.now(), client: document.getElementById('sc').value, phone: document.getElementById('sph').value,
      product: name, amount: +document.getElementById('sa').value, purchase: +document.getElementById('spurchase').value,
      date: saleDate, expiry: tenure ? expiry(saleDate, tenure) : '', payment: document.getElementById('payment').value, tenure, type: tenure ? 'Subscription' : 'Product'
    });
    save(); closeModal(); render();
  };
}

function openProduct() {
  modal(`<div class="sectionHead"><h2>Add Product</h2><button onclick="closeModal()">×</button></div><form id="pf" class="grid">
  <label class="field full"><span>Name *</span><input id="pn" required></label>
  <label class="field"><span>Price *</span><input id="pp" type="number" required></label>
  <label class="field"><span>Type</span><select id="pt"><option>Subscription</option><option>Product</option></select></label>
  <div class="full actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Save</button></div></form>`);
  document.getElementById('pf').onsubmit = e => {
    e.preventDefault();
    data.products.push({ id: Date.now(), name: document.getElementById('pn').value, price: +document.getElementById('pp').value, type: document.getElementById('pt').value });
    save(); closeModal(); render();
  };
}

function salesTable(a){
 if(!a.length) return '<div class="empty">No sales yet.</div>';
 return `<div class="table"><table><thead><tr><th>Client</th><th>Item</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody>${a.map(s=>`<tr><td><b>${esc(s.client)}</b><br><span class="muted">${esc(s.phone||'')}</span></td><td>${esc(s.product)}</td><td>${rs(s.amount)}</td><td><span class="badge ${s.payment==='Paid'?'Active':'Expired'}">${s.payment}</span></td><td>${s.date}</td></tr>`).join('')}</tbody></table></div>`;
}

function salesPage(){ return `<div class="sectionHead"><div><h1>Sales</h1></div><button class="primary" onclick="openSale()">＋ Add Sale</button></div><section>${salesTable(data.sales)}</section>`; }

function productsPage(){
 const rows = data.products.map(p=>`<tr><td><div style="display:flex;align-items:center;gap:8px">${getProductIcon(p.name)}<b>${esc(p.name)}</b></div></td><td>${rs(p.price)}</td><td>${p.type}</td></tr>`).join('');
 return `<div class="sectionHead"><div><h1>Products</h1></div><button class="primary" onclick="openProduct()">＋ Add Product</button></div><section><div class="table"><table><thead><tr><th>Product</th><th>Price</th><th>Type</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function clientsPage(){
 let map={}; data.sales.forEach(s=>{if(!s.client)return; let k=s.client; if(!map[k])map[k]={name:s.client,phone:s.phone,total:0,count:0}; map[k].total+=Number(s.amount); map[k].count++;});
 let arr=Object.values(map);
 return `<h1>Clients</h1><section><div class="table"><table><thead><tr><th>Name</th><th>Phone</th><th>Purchases</th><th>Total</th></tr></thead><tbody>${arr.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'—')}</td><td>${c.count}</td><td>${rs(c.total)}</td></tr>`).join('')}</tbody></table></div></section>`;
}

function pendingPage(){
 let pending=data.sales.filter(s=>s.payment!=='Paid');
 return `<h1>Pending Payments</h1><section>${salesTable(pending)}</section>`;
}

function expensesPage(){
 return `<div class="sectionHead"><div><h1>Expenses</h1></div><button class="primary" onclick="openExpense()">＋ Add Expense</button></div><section>${data.expenses.length?`<div class="table"><table><thead><tr><th>Title</th><th>Amount</th><th>Date</th></tr></thead><tbody>${data.expenses.map(e=>`<tr><td>${esc(e.title)}</td><td>${rs(e.amount)}</td><td>${e.date}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No expenses.</div>'}</section>`;
}

function openExpense(){
 modal(`<div class="sectionHead"><h2>Add Expense</h2><button onclick="closeModal()">×</button></div><form id="ef" class="grid">
 <label class="field full"><span>Title *</span><input id="et" required></label>
 <label class="field"><span>Amount *</span><input id="ea" type="number" required></label>
 <label class="field"><span>Date</span><input id="ed" type="date" value="${today()}"></label>
 <div class="full actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Save</button></div></form>`);
 ef.onsubmit=e=>{e.preventDefault(); data.expenses.unshift({id:Date.now(), title:document.getElementById('et').value, amount:+document.getElementById('ea').value, date:document.getElementById('ed').value}); save(); closeModal(); render();}
}

function profitPage(){
 let paid=income(data.sales), cost=purchase(data.sales.filter(s=>s.payment!=='Pending')), exp=expenses(data.expenses);
 return `<h1>Profit Analytics</h1><div class="cards"><div class="card"><small>REVENUE</small><b>${rs(paid)}</b></div><div class="card"><small>COST</small><b>${rs(cost)}</b></div><div class="card"><small>EXPENSES</small><b>${rs(exp)}</b></div><div class="card"><small>NET PROFIT</small><b style="color:#166534">${rs(paid-cost-exp)}</b></div></div>`;
}

function reports(){ return `<h1>Reports & Backup</h1><button class="primary" onclick="const blob=new Blob([JSON.stringify(data)],{type:'json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup.json';a.click();">Export Backup</button>`; }

window.renderApp = function() {
  document.getElementById('app').innerHTML = page==='dashboard'?dashboard():page==='sales'?salesPage():page==='products'?productsPage():page==='clients'?clientsPage():page==='pending'?pendingPage():page==='expenses'?expensesPage():page==='profit'?profitPage():reports();
}
function render() { window.renderApp(); }

Object.assign(window, { modal, closeModal, go, render, openSale, openProduct, openExpense });

render();

let deferredInstallPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById('installBtn').style.display = 'inline-block';
});

window.installApp = async function() {
  if (!deferredInstallPrompt) {
    alert('App install prompt is ready. If not visible, use Chrome menu (⋮) -> "Install app".');
    return;
  }
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
}

onSnapshot(cloudRef, snap => {
  if(snap.exists() && snap.data().data) {
    data = snap.data().data;
    localStorage.setItem(DB, JSON.stringify(data));
    cloudReady = true;
    document.getElementById('syncStatus').textContent = 'CLOUD SYNCED ✓';
    render();
  } else {
    cloudReady = true;
    save();
  }
}, err => { document.getElementById('syncStatus').textContent = 'OFFLINE'; });
</script>
</body>
</html>
